# Publishes the web tool to GitHub Pages: every push to the WebUI branch (a merged pull request) builds the site with
# WebGUI/tools/build_site.py and deploys it.  The site holds the page (WebGUI/), the generators' own .py files as one
# zip, and a backup copy of Pyodide of which every file is checked against the SHA-256 in WebGUI/vendor.json: a file
# that differs stops the build, and nothing is published.
#
# After the deploy the live address is opened in a browser once: the page must show the commit that was built, start
# Python and make its first board (WebGUI/tests/live.mjs).
#
# Rollback: open the last good run of this workflow under Actions and press "Re-run all jobs".
#
# Every action is pinned to a full commit hash.  Only the deploy job may write to Pages.

name: Web GUI On GitHub Pages

on:
  push:
    branches: [WebUI]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/WebUI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build the site, with the backup copy of Pyodide checked against WebGUI/vendor.json
        run: python WebGUI/tools/build_site.py --out site --fetch-vendor --commit "$GITHUB_SHA"
      - name: Check the backup copy once more, as it lies in the site
        run: python WebGUI/tools/vendor_lock.py --check site/WebGUI/vendor/pyodide
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  live:
    name: Live check
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: WebGUI/package-lock.json
      - name: Install Playwright and Chromium
        working-directory: WebGUI
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Open the live page, wait for its first board
        working-directory: WebGUI
        env:
          LIVE_URL: ${{ needs.deploy.outputs.url }}WebGUI/
        run: node tests/live.mjs "$LIVE_URL" "$GITHUB_SHA"
