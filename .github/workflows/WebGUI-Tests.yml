# The checks of the web tool (WebGUI/), on every pull request into WebUI and on every push to the working branch
# WebUI_modifs that touches the tool or the generators it runs.
#
#   Bridge      WebGUI/WebGenerator.py under plain Python: its unit tests, ruff, and actionlint on these two workflows
#   Site        the folder GitHub Pages serves, built by WebGUI/tools/build_site.py with the checked backup copy of
#               Pyodide; kept as an artifact for 7 days, so a pull request can be tried before it is merged
#   Browsers    the Playwright tests of WebGUI/tests on Chromium, Firefox and WebKit, against that built site.  The
#               tests answer the CDN themselves from the site's checked copy; a failed run keeps its report
#
# Every action is pinned to a full commit hash, the token is read-only and is not kept in the checkout.

name: Web Tool Tests

on:
  pull_request:
    branches: [WebUI]
  push:
    branches: [WebUI_modifs]
    paths:
      - "WebGUI/**"
      - "Generators/**"
      - ".github/workflows/WebGUI-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-tool-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  bridge:
    name: Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install requirements.txt (numpy and ruff)
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: ruff on the web tool
        run: ruff check --output-format=github WebGUI
      - name: actionlint on the web tool's workflows
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
          .github/workflows/WebGUI-Tests.yml .github/workflows/WebGUI-Pages.yml
      - name: The bridge's unit tests
        run: python -m unittest -v WebGUI/tests/test_bridge.py

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build the site, with the backup copy of Pyodide checked against WebGUI/vendor.json
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python WebGUI/tools/build_site.py --out site --fetch-vendor --commit "$COMMIT"
      - name: Check the backup copy once more, as it lies in the site
        run: python WebGUI/tools/vendor_lock.py --check site/WebGUI/vendor/pyodide
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 7
          if-no-files-found: error

  browsers:
    name: ${{ matrix.browser }}
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: WebGUI/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Install Playwright (the version in WebGUI/package-lock.json) and the browser
        working-directory: WebGUI
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          npm ci
          npx playwright install --with-deps "$BROWSER"
      - name: The browser tests on ${{ matrix.browser }}
        working-directory: WebGUI
        env:
          WEBGUI_SITE: ${{ github.workspace }}/site
          BROWSER: ${{ matrix.browser }}
        run: npx playwright test --project="$BROWSER"
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.browser }}
          path: |
            WebGUI/playwright-report
            WebGUI/test-results
          retention-days: 14
