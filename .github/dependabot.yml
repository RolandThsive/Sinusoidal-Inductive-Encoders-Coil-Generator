# Dependabot proposes, once a week, a pull request when a newer numpy, a newer CI tool (requirements.txt) or a newer
# version of an action used by the workflows comes out.  Each proposal runs the whole CI before it can be merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Dependencies"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ["*"]

  # The test tools of the web tool (WebGUI/package.json on the working branch of the web tool)
  - package-ecosystem: npm
    directory: "/WebGUI"
    target-branch: WebUI_modifs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Web tool"
