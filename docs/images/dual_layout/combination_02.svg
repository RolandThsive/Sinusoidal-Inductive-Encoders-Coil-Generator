<text x="24" y="711" font-size="17" font-weight="bold" fill="#1a1a1a">1  Both RX bands and TRACK_GAP_MM given</text>
<text x="24" y="736" font-size="15" fill="#555555">Both bands are used as given. The bore is the RX1 band start less INNER_EDGE_INSET_MM. The outline is the RX2 band end plus the room the TX2 ring, its tail or</text>
<text x="24" y="757" font-size="15" fill="#555555">fingers, and the margins need. The gap between set 1's outermost copper and set 2's innermost copper is measured, and must be at least TRACK_GAP_MM. Here the</text>
<text x="24" y="778" font-size="15" fill="#555555">RX1 band runs 8.45 ... 11.7 mm and the RX2 band 18 ... 23.9 mm; set 1's copper reaches r = 13.975 mm and set 2's starts at r = 17.7 mm, 3.725 mm apart; the bore</text>
<text x="24" y="799" font-size="15" fill="#555555">is 7.25 mm and the outline 26.875 mm.</text>
