<text x="24" y="77" font-size="15" fill="#555555">Drawn from the reference board Board083-layout-02-both-bands-and-gap (regression/DualCoilSetGenerator_regression), cut along the radius at 90 deg: the copper is</text>
<text x="24" y="98" font-size="15" fill="#555555">what that cut meets in its Stator.kicad_pcb. Given: the RX1 band (8.45 ... 11.7 mm, Dual_RX1), the RX2 band (18 ... 23.9 mm, Dual_RX2), TRACK_GAP_MM (3 mm).</text>
<text x="24" y="119" font-size="15" fill="#555555">Across the board true scale; through the board not to scale, the copper drawn thicker.</text>
