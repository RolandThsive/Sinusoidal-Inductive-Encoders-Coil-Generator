<text x="24" y="711" font-size="17" font-weight="bold" fill="#1a1a1a">1  RX1 band and TRACK_GAP_MM given</text>
<text x="24" y="736" font-size="15" fill="#555555">The RX2 band is placed so that set 2's innermost copper (its inner vias) sits TRACK_GAP_MM out from set 1's outermost copper (its TX ring, tail or fingers), and</text>
<text x="24" y="757" font-size="15" fill="#555555">is as wide as the RX1 band. The bore is the RX1 band start less INNER_EDGE_INSET_MM. The outline is the RX2 band end plus the room the TX2 ring, its tail or</text>
<text x="24" y="778" font-size="15" fill="#555555">fingers, and the margins need. Here the RX1 band runs 9.7 ... 16.05 mm and the RX2 band 19.55 ... 25.9 mm; set 1's copper reaches r = 18.75 mm and set 2's</text>
<text x="24" y="799" font-size="15" fill="#555555">starts at r = 19.25 mm, 0.5 mm apart; the bore is 8.5 mm and the outline 29.5 mm.</text>
