<text x="24" y="77" font-size="15" fill="#555555">Drawn from the reference board Board097-layout-18-rx2-band-and-gap (regression/DualCoilSetGenerator_regression), cut along the radius at 90 deg: the copper is</text>
<text x="24" y="98" font-size="15" fill="#555555">what that cut meets in its Stator.kicad_pcb. Given: the RX2 band (18 ... 23.9 mm, Dual_RX2), TRACK_GAP_MM (1 mm). Across the board true scale; through the board</text>
<text x="24" y="119" font-size="15" fill="#555555">not to scale, the copper drawn thicker.</text>
