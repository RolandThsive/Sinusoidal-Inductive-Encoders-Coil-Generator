<text x="24" y="711" font-size="17" font-weight="bold" fill="#1a1a1a">1  RX2 band given</text>
<text x="24" y="736" font-size="15" fill="#555555">The RX1 band is placed so that set 1's outermost copper (its TX ring, tail or fingers) sits MIN_CLEARANCE_MM (TRACK_GAP_MM is None) inside set 2's innermost</text>
<text x="24" y="757" font-size="15" fill="#555555">copper (its inner vias), and is as wide as the RX2 band. The bore is the RX1 band start less INNER_EDGE_INSET_MM. The outline is the RX2 band end plus the room</text>
<text x="24" y="778" font-size="15" fill="#555555">the TX2 ring, its tail or fingers, and the margins need. Here the RX1 band runs 9.375 ... 15.275 mm and the RX2 band 18 ... 23.9 mm; set 1's copper reaches r =</text>
<text x="24" y="799" font-size="15" fill="#555555">17.55 mm and set 2's starts at r = 17.7 mm, 0.15 mm apart; the bore is 8.175 mm and the outline 26.875 mm.</text>
