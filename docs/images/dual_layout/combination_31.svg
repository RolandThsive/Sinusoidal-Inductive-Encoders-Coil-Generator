<text x="24" y="736" font-size="15" fill="#555555">Both bands are fitted between the two edges as given: from the bore, INNER_EDGE_INSET_MM, the RX1 band, the TX1 ring, MIN_CLEARANCE_MM (TRACK_GAP_MM is None),</text>
<text x="24" y="757" font-size="15" fill="#555555">set 2's inner vias, the RX2 band, and the TX2 ring with the margins up to the outline. BAND_SPLIT shares what is left between the two bands (0.5: equal widths).</text>
<text x="24" y="778" font-size="15" fill="#555555">Here the RX1 band runs 7.2 ... 14.75 mm and the RX2 band 17.475 ... 25.025 mm; set 1's copper reaches r = 17.025 mm and set 2's starts at r = 17.175 mm, 0.15 mm</text>
<text x="24" y="799" font-size="15" fill="#555555">apart; the bore is 6 mm and the outline 28 mm.</text>
