<text x="24" y="711" font-size="17" font-weight="bold" fill="#1a1a1a">1  Both RX bands and outline given</text>
<text x="24" y="736" font-size="15" fill="#555555">Both bands are used as given. The bore is the RX1 band start less INNER_EDGE_INSET_MM. The outline is used as given; the Single Generator checks that it leaves</text>
<text x="24" y="757" font-size="15" fill="#555555">room for the TX2 ring, its tail or fingers, and the margins. The gap between set 1's outermost copper and set 2's innermost copper is measured, and must be at</text>
<text x="24" y="778" font-size="15" fill="#555555">least MIN_CLEARANCE_MM (TRACK_GAP_MM is None). Here the RX1 band runs 8.45 ... 11.7 mm and the RX2 band 18 ... 23.9 mm; set 1's copper reaches r = 13.975 mm and</text>
<text x="24" y="799" font-size="15" fill="#555555">set 2's starts at r = 17.7 mm, 3.725 mm apart; the bore is 7.25 mm and the outline 28 mm.</text>
