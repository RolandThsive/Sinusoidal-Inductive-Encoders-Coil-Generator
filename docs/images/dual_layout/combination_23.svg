<text x="24" y="711" font-size="17" font-weight="bold" fill="#1a1a1a">1  RX2 band, bore and outline given</text>
<text x="24" y="736" font-size="15" fill="#555555">The RX1 band is placed so that set 1's outermost copper (its TX ring, tail or fingers) sits MIN_CLEARANCE_MM (TRACK_GAP_MM is None) inside set 2's innermost</text>
<text x="24" y="757" font-size="15" fill="#555555">copper (its inner vias), and starts at the bore plus INNER_EDGE_INSET_MM. The bore is used as given; the Single Generator checks that it leaves</text>
<text x="24" y="778" font-size="15" fill="#555555">INNER_EDGE_INSET_MM inside the RX1 band. The outline is used as given; the Single Generator checks that it leaves room for the TX2 ring, its tail or fingers,</text>
<text x="24" y="799" font-size="15" fill="#555555">and the margins. Here the RX1 band runs 7.2 ... 15.275 mm and the RX2 band 18 ... 23.9 mm; set 1's copper reaches r = 17.55 mm and set 2's starts at r = 17.7</text>
<text x="24" y="820" font-size="15" fill="#555555">mm, 0.15 mm apart; the bore is 6 mm and the outline 28 mm.</text>
</svg>
