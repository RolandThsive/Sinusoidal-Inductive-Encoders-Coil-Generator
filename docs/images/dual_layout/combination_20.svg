<text x="24" y="711" font-size="17" font-weight="bold" fill="#1a1a1a">1  RX2 band, bore and TRACK_GAP_MM given</text>
<text x="24" y="736" font-size="15" fill="#555555">The RX1 band is placed so that set 1's outermost copper (its TX ring, tail or fingers) sits TRACK_GAP_MM inside set 2's innermost copper (its inner vias), and</text>
<text x="24" y="757" font-size="15" fill="#555555">starts at the bore plus INNER_EDGE_INSET_MM. The bore is used as given; the Single Generator checks that it leaves INNER_EDGE_INSET_MM inside the RX1 band. The</text>
<text x="24" y="778" font-size="15" fill="#555555">outline is the RX2 band end plus the room the TX2 ring, its tail or fingers, and the margins need. Here the RX1 band runs 7.2 ... 14.425 mm and the RX2 band 18</text>
<text x="24" y="799" font-size="15" fill="#555555">... 23.9 mm; set 1's copper reaches r = 16.7 mm and set 2's starts at r = 17.7 mm, 1 mm apart; the bore is 6 mm and the outline 26.875 mm.</text>
</svg>
