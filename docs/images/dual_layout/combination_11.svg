<text x="24" y="711" font-size="17" font-weight="bold" fill="#1a1a1a">1  RX1 band and bore given</text>
<text x="24" y="736" font-size="15" fill="#555555">The RX2 band is placed so that set 2's innermost copper (its inner vias) sits MIN_CLEARANCE_MM (TRACK_GAP_MM is None) out from set 1's outermost copper (its TX</text>
<text x="24" y="757" font-size="15" fill="#555555">ring, tail or fingers), and is as wide as the RX1 band. The bore is used as given; the Single Generator checks that it leaves INNER_EDGE_INSET_MM inside the RX1</text>
<text x="24" y="778" font-size="15" fill="#555555">band. The outline is the RX2 band end plus the room the TX2 ring, its tail or fingers, and the margins need. Here the RX1 band runs 8.45 ... 11.7 mm and the RX2</text>
<text x="24" y="799" font-size="15" fill="#555555">band 14.425 ... 17.675 mm; set 1's copper reaches r = 13.975 mm and set 2's starts at r = 14.125 mm, 0.15 mm apart; the bore is 6 mm and the outline 20.65 mm.</text>
